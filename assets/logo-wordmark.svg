<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" role="img" aria-labelledby="t">
  <title id="t">Interview briefing</title>
  <defs>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2997ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#2997ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2997ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="400" rx="40" fill="#07080c"/>
  <rect width="1600" height="400" rx="40" fill="url(#glow)"/>
  <rect x="1" y="1" width="1598" height="398" rx="39" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="2"/>
  <svg x="88" y="72" width="256" height="256" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="m-accent" x1="96" y1="96" x2="416" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2997ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="m-glow" cx="0.3" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#2997ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2997ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#07080c"/>
  <rect width="512" height="512" rx="112" fill="url(#m-glow)"/>
  <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="2"/>
  <g transform="translate(6 6)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- the lens: three arcs, one per agent (Researcher, Editor, Writer) -->
    <g stroke="url(#m-accent)" stroke-width="36">
      <path d="M352 224 A128 128 0 0 1 224 352"/>
      <path d="M160 334.85 A128 128 0 0 1 113.15 160"/>
      <path d="M160 113.15 A128 128 0 0 1 334.85 160"/>
      <path d="M330 330 L398 398" stroke-width="44"/>
    </g>
    <!-- verified -->
    <path d="M168 228 L208 268 L284 188" stroke="#f5f5f7" stroke-width="32"/>
  </g>
</svg>
  <!-- Inter where installed; falls back to the system sans -->
  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="400" y="218" font-size="112" font-weight="700" letter-spacing="-4" fill="url(#text)">Interview briefing</text>
    <text x="404" y="290" font-size="38" font-weight="500" fill="#ebebf5" fill-opacity="0.6">Multi-agent company &amp; role research, fact-checked</text>
  </g>
</svg>
